<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<section class="contact-section">
  <div class="container">
    
    <!-- Animated Title -->
    <div class="title-wrapper" [class.animate]="isTitleVisible">
      <h2 class="section-title">Let's Work Together</h2>
      <p class="section-subtitle">Have a project in mind? Let's create something amazing!</p>
      <div class="title-underline"></div>
    </div>

    <!-- Contact Links Cards -->
    <div class="contact-links" [class.animate]="isCardsVisible">
      @for (link of contactLinks; track link.title; let i = $index) {
        <a 
          [href]="link.link" 
          target="_blank"
          class="contact-card"
          [style.animation-delay]="(i * 0.1) + 's'">
          <div class="card-icon">
            <i [class]="'bi ' + link.icon"></i>
          </div>
          <h3 class="card-title">{{ link.title }}</h3>
          <p class="card-value">{{ link.value }}</p>
          <div class="card-arrow">
            <i class="bi bi-arrow-right"></i>
          </div>
        </a>
      }
    </div>

    <!-- Contact Form -->
    <div class="form-wrapper" [class.animate]="isFormVisible">
      <div class="form-container">
        <div class="form-header">
          <i class="bi bi-send-fill form-header-icon"></i>
          <h3 class="form-title">Send Me a Message</h3>
          <p class="form-subtitle">Fill out the form below and I'll get back to you as soon as possible</p>
        </div>

        <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="contact-form">
          
          <div class="form-row">
            <div class="form-group">
              <label for="name" class="form-label">
                <i class="bi bi-person-fill"></i> Your Name *
              </label>
              <input 
                type="text" 
                id="name"
                name="name"
                [(ngModel)]="formData.name"
                class="form-input"
                placeholder="John Doe"
                required>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">
                <i class="bi bi-envelope-fill"></i> Your Email *
              </label>
              <input 
                type="email" 
                id="email"
                name="email"
                [(ngModel)]="formData.email"
                class="form-input"
                placeholder="john@example.com"
                required>
            </div>
          </div>

          <div class="form-group">
            <label for="subject" class="form-label">
              <i class="bi bi-tag-fill"></i> Subject
            </label>
            <input 
              type="text" 
              id="subject"
              name="subject"
              [(ngModel)]="formData.subject"
              class="form-input"
              placeholder="Project Collaboration">
          </div>

          <div class="form-group">
            <label for="message" class="form-label">
              <i class="bi bi-chat-left-text-fill"></i> Message *
            </label>
            <textarea 
              id="message"
              name="message"
              [(ngModel)]="formData.message"
              class="form-textarea"
              placeholder="Tell me about your project..."
              rows="6"
              required></textarea>
          </div>

          <button type="submit" class="submit-btn">
            <span class="btn-text">Send Message</span>
            <i class="bi bi-arrow-right-circle-fill btn-icon"></i>
          </button>
        </form>
      </div>
    </div>

  </div>
</section>
